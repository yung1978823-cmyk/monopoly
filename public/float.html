<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮島棋盤</title>
<style>
:root { --ink: #F3F7E9; --muted: #B9C9A7; --panel: rgba(12, 28, 20, 0.78); --edge: #E6C35C; --bg: #0E1F17; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans HK", system-ui, sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; justify-content: center; pointer-events: none; }
#hud p { margin: 0; background: var(--panel); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 16px; font-weight: 800; font-size: 14px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
button { font: inherit; font-weight: 800; font-size: 15px; color: var(--ink); background: var(--panel); border: 2px solid var(--edge); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
button[aria-pressed="false"] { opacity: 0.55; border-color: var(--muted); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
#err { position: fixed; inset: 40% 16px auto; text-align: center; font-weight: 800; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;800&display=swap">
</head>
<body>
<div id="stage"></div>
<div id="hud"><p id="note">浮島棋盤：拖動可以轉鏡頭</p></div>
<div id="bar">
  <button id="bob" type="button" aria-pressed="true">格仔浮動</button>
  <button id="glow" type="button" aria-pressed="true">光同粒子</button>
  <button id="para" type="button" aria-pressed="true">遠近感</button>
</div>
<p id="err" hidden>載入唔到三維工具</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const T = window.THREE;
  if (!T) { document.getElementById("err").hidden = false; return; }
  const TILES = [{"k":"o0","x":-6.788,"z":0,"kind":"start","gold":false,"group":0},{"k":"o1","x":-5.94,"z":0.849,"kind":"lot","gold":false,"group":0},{"k":"o2","x":-5.091,"z":1.697,"kind":"lot","gold":false,"group":0},{"k":"o3","x":-4.243,"z":2.546,"kind":"lot","gold":false,"group":0},{"k":"o4","x":-3.394,"z":3.394,"kind":"chest","gold":false,"group":1},{"k":"o5","x":-2.546,"z":2.546,"kind":"lot","gold":false,"group":1},{"k":"o6","x":-1.697,"z":1.697,"kind":"lot","gold":false,"group":1},{"k":"o7","x":-0.849,"z":0.849,"kind":"lot","gold":false,"group":1},{"k":"o8","x":0,"z":0,"kind":"cross","gold":false,"group":2},{"k":"o9","x":0.849,"z":-0.849,"kind":"lot","gold":false,"group":2},{"k":"o10","x":1.697,"z":-1.697,"kind":"lot","gold":false,"group":2},{"k":"o11","x":2.546,"z":-2.546,"kind":"lot","gold":false,"group":2},{"k":"o12","x":3.394,"z":-3.394,"kind":"fly","gold":false,"group":3},{"k":"o13","x":4.243,"z":-2.546,"kind":"lot","gold":false,"group":3},{"k":"o14","x":5.091,"z":-1.697,"kind":"fork","gold":false,"group":3},{"k":"o15","x":5.94,"z":-0.849,"kind":"lot","gold":false,"group":3},{"k":"o16","x":6.788,"z":0,"kind":"jail","gold":false,"group":4},{"k":"o17","x":5.94,"z":0.849,"kind":"lot","gold":false,"group":4},{"k":"o18","x":5.091,"z":1.697,"kind":"lot","gold":false,"group":4},{"k":"o19","x":4.243,"z":2.546,"kind":"lot","gold":false,"group":4},{"k":"o20","x":3.394,"z":3.394,"kind":"chance","gold":false,"group":5},{"k":"o21","x":2.546,"z":2.546,"kind":"lot","gold":false,"group":5},{"k":"o22","x":1.697,"z":1.697,"kind":"lot","gold":false,"group":5},{"k":"o23","x":0.849,"z":0.849,"kind":"lot","gold":false,"group":5},{"k":"o25","x":-0.849,"z":-0.849,"kind":"lot","gold":false,"group":6},{"k":"o26","x":-1.697,"z":-1.697,"kind":"lot","gold":false,"group":6},{"k":"o27","x":-2.546,"z":-2.546,"kind":"lot","gold":false,"group":6},{"k":"o28","x":-3.394,"z":-3.394,"kind":"tax","gold":false,"group":7},{"k":"o29","x":-4.243,"z":-2.546,"kind":"lot","gold":false,"group":7},{"k":"o30","x":-5.091,"z":-1.697,"kind":"fork","gold":false,"group":7},{"k":"o31","x":-5.94,"z":-0.849,"kind":"lot","gold":false,"group":7},{"k":"L1","x":-4.243,"z":-0.849,"kind":"lot","gold":true,"group":-1},{"k":"L2","x":-3.394,"z":0,"kind":"lot","gold":true,"group":-1},{"k":"L3","x":-2.546,"z":0.849,"kind":"lot","gold":true,"group":-1},{"k":"R1","x":4.243,"z":-0.849,"kind":"lot","gold":true,"group":-1},{"k":"R2","x":3.394,"z":0,"kind":"lot","gold":true,"group":-1},{"k":"R3","x":2.546,"z":0.849,"kind":"lot","gold":true,"group":-1}]
;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const opts = { bob: !reduce, glow: true, para: true };

  const stage = document.getElementById("stage");
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new T.Scene();
  // Forest-green sky: lighter up high, deep green below, with fog so far things fade into it.
  const sky = document.createElement("canvas"); sky.width = 4; sky.height = 256;
  const sg = sky.getContext("2d"), grd = sg.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, "#4E7A3A"); grd.addColorStop(0.45, "#27472B"); grd.addColorStop(1, "#0C1A12");
  sg.fillStyle = grd; sg.fillRect(0, 0, 4, 256);
  const skyTex = new T.CanvasTexture(sky); skyTex.encoding = T.sRGBEncoding;
  scene.background = skyTex;
  scene.fog = new T.Fog(0x1d3522, 22, 60);

  const camera = new T.PerspectiveCamera(40, 1, 0.1, 200);
  scene.add(new T.HemisphereLight(0xdff5c8, 0x1a2a1c, 0.75));
  const sun = new T.DirectionalLight(0xfff0c8, 1.0);
  sun.position.set(-6, 14, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 10, bottom: -10, near: 1, far: 40 });
  scene.add(sun);

  const mat = (c, extra) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, flatShading: true }, extra || {}));
  const rough = (geo, amt, seed) => { // jitter vertices for a hand-cut rock look
    const p = geo.attributes.position; let s = seed;
    const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647 - 0.5);
    const seen = new Map();
    for (let i = 0; i < p.count; i++) {
      const k = p.getX(i).toFixed(3) + "," + p.getY(i).toFixed(3) + "," + p.getZ(i).toFixed(3);
      if (!seen.has(k)) seen.set(k, [rnd() * amt, rnd() * amt * 0.6, rnd() * amt]);
      const d = seen.get(k); p.setXYZ(i, p.getX(i) + d[0], p.getY(i) + d[1], p.getZ(i) + d[2]);
    }
    geo.computeVertexNormals(); return geo;
  };
  const GROUPS = [0xe52521, 0xf59e0b, 0x22a447, 0x38bdf8, 0x3949ab, 0xec4899, 0x9a5b2e, 0x14b8a6];

  // Soft round textures: a shadow blot and a glow.
  function blob(inner, outer) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, inner); g.addColorStop(1, outer); x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new T.CanvasTexture(c);
  }
  const shadowTex = blob("rgba(0,0,0,0.55)", "rgba(0,0,0,0)");
  const glowTex = blob("rgba(140,255,200,0.9)", "rgba(140,255,200,0)");

  // ---------- Layers: far background, the floating board, particles in between ----------
  const far = new T.Group(); scene.add(far);
  const board = new T.Group(); scene.add(board);

  const floaters = [];
  const glows = [];
  function island(size, seed, bigTop) {
    const g = new T.Group();
    const grass = new T.Mesh(rough(new T.CylinderGeometry(0.52 * size, 0.55 * size, 0.14, 8), 0.05, seed), mat(bigTop || 0x7cc653));
    grass.position.y = 0.07; grass.castShadow = grass.receiveShadow = true; g.add(grass);
    const dirt = new T.Mesh(rough(new T.CylinderGeometry(0.55 * size, 0.46 * size, 0.2, 8), 0.06, seed + 3), mat(0x7a5230));
    dirt.position.y = -0.1; dirt.castShadow = true; g.add(dirt);
    const rock = new T.Mesh(rough(new T.ConeGeometry(0.46 * size, 0.75 * size, 7), 0.1, seed + 7), mat(0x5d6168));
    rock.rotation.x = Math.PI; rock.position.y = -0.2 - 0.375 * size; rock.castShadow = true; g.add(rock);
    return g;
  }

  // The squares' furniture, kept small and at the back of each island so pawns stay in view.
  function decorate(kind, g, gold, group) {
    const top = 0.15;
    const add = (m, x, y, z) => { m.position.set(x, top + y, z); m.castShadow = true; g.add(m); return m; };
    if (kind === "lot") {
      const pole = add(new T.Mesh(new T.CylinderGeometry(0.02, 0.02, 0.5, 6), mat(0xdedede)), 0.28, 0.25, -0.2);
      const flag = add(new T.Mesh(new T.PlaneGeometry(0.22, 0.14), mat(GROUPS[group % 8], { side: T.DoubleSide })), 0.39, 0.42, -0.2);
      floaters.push({ flag, t: Math.random() * 6 });
      if (gold) add(new T.Mesh(new T.OctahedronGeometry(0.1), mat(0xfbd000, { metalness: 0.5, roughness: 0.3, emissive: 0x4a3600 })), -0.25, 0.12, -0.2);
    }
    if (kind === "start") {
      const ring = add(new T.Mesh(new T.TorusGeometry(0.36, 0.06, 10, 28), mat(0x49d1ff, { emissive: 0x1a8fbf, emissiveIntensity: 0.9 })), 0, 0.42, -0.25);
      const gate = add(new T.Mesh(new T.CircleGeometry(0.33, 28), new T.MeshBasicMaterial({ color: 0x9ff0ff, transparent: true, opacity: 0.55 })), 0, 0.42, -0.25);
      floaters.push({ spin: ring }, { pulse: gate });
    }
    if (kind === "chest") {
      add(new T.Mesh(new T.BoxGeometry(0.4, 0.24, 0.28), mat(0x9a5b2e)), 0, 0.12, -0.22);
      add(new T.Mesh(new T.BoxGeometry(0.08, 0.26, 0.3), mat(0xfbd000, { metalness: 0.5 })), 0, 0.14, -0.22);
    }
    if (kind === "jail") for (let b = -2; b <= 2; b++) add(new T.Mesh(new T.CylinderGeometry(0.025, 0.025, 0.5, 6), mat(0x9aa4b1, { metalness: 0.5 })), b * 0.11, 0.25, -0.25);
    if (kind === "chance") {
      const c = add(new T.Mesh(new T.OctahedronGeometry(0.2), mat(0xd946ef, { emissive: 0x7a1d8f, emissiveIntensity: 0.8, roughness: 0.3 })), 0, 0.5, -0.2);
      c.scale.y = 1.6; floaters.push({ spin: c });
    }
    if (kind === "tax") add(new T.Mesh(new T.CylinderGeometry(0.2, 0.2, 0.06, 20), mat(0xfbd000, { metalness: 0.6, roughness: 0.3 })), 0, 0.2, -0.2).rotation.x = Math.PI / 2;
    if (kind === "cross") { const x1 = add(new T.Mesh(new T.BoxGeometry(0.5, 0.08, 0.12), mat(0xff7a59)), 0, 0.05, -0.1); x1.rotation.y = 0.785; const x2 = add(new T.Mesh(new T.BoxGeometry(0.5, 0.08, 0.12), mat(0xff7a59)), 0, 0.05, -0.1); x2.rotation.y = -0.785; }
    if (kind === "fly") { const p = add(new T.Group(), 0, 0.45, -0.2); const hull = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 0.5, 8), mat(0xffffff)); hull.rotation.z = Math.PI / 2; p.add(hull); p.add(new T.Mesh(new T.BoxGeometry(0.12, 0.02, 0.55), mat(0xe52521))); floaters.push({ spin: p }); }
    if (kind === "fork") { add(new T.Mesh(new T.CylinderGeometry(0.03, 0.03, 0.5, 6), mat(0x8b5a2b)), 0.2, 0.25, -0.2); add(new T.Mesh(new T.BoxGeometry(0.3, 0.1, 0.03), mat(0xd9a45b)), 0.28, 0.42, -0.2); }
  }

  // ---------- The 八字 board: every square is its own little island ----------
  const tiles = [];
  TILES.forEach((t, i) => {
    const big = ["start", "jail", "chest", "fly", "cross"].includes(t.kind);
    const g = new T.Group();
    const isl = island(big ? 1.3 : 1, 100 + i * 17, t.gold ? 0xb7d84a : null);
    g.add(isl);
    decorate(t.kind, g, t.gold, t.group);
    g.position.set(t.x, 0, t.z);
    g.rotation.y = Math.PI / 4;
    board.add(g);
    // Drop shadow on the mist far below, and a faint glow under the rock.
    const sh = new T.Mesh(new T.PlaneGeometry(1.6, 1.6), new T.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.set(t.x, -2.49, t.z); board.add(sh);
    const gl = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: t.kind === "start" ? 0x6fe3ff : 0x9dffb0, transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: 0.55 }));
    gl.scale.set(1.3, 0.9, 1); gl.position.set(t.x, -0.9, t.z); board.add(gl); glows.push(gl);
    tiles.push({ g, sh, gl, phase: Math.random() * Math.PI * 2, period: 3.2 + Math.random() * 1.2 });
  });

  // Two big grass islands inside the diamonds, with trees, and the castle over the crossing.
  const D = 3.394;
  [[-D, 0], [D, 0]].forEach(([x, z], n) => {
    const g = island(3.2, 900 + n, 0x6fb84a); g.position.set(x, -0.35, z); board.add(g);
    for (let k = 0; k < 5; k++) {
      const a = k * 1.3 + n, r = 0.4 + (k % 3) * 0.35;
      const trunk = new T.Mesh(new T.CylinderGeometry(0.06, 0.09, 0.5, 6), mat(0x6b4423)); trunk.position.set(x + Math.cos(a) * r, -0.05, z + Math.sin(a) * r);
      const crown = new T.Mesh(rough(new T.IcosahedronGeometry(0.34, 0), 0.08, 50 + k), mat(k % 2 ? 0x4fa83a : 0x3d8f2e)); crown.position.set(trunk.position.x, 0.38, trunk.position.z);
      trunk.castShadow = crown.castShadow = true; board.add(trunk, crown);
    }
    tiles.push({ g, sh: null, gl: null, phase: n * 2, period: 5 });
  });

  // Mist floor far below to catch the shadows.
  const mist = new T.Mesh(new T.PlaneGeometry(120, 120), new T.MeshStandardMaterial({ color: 0x1a3020, roughness: 1 }));
  mist.rotation.x = -Math.PI / 2; mist.position.y = -2.5; scene.add(mist);

  // ---------- Far layer: big rock pillars and islands in the haze ----------
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2, r = 20 + (i % 4) * 5;
    const h = 6 + (i % 5) * 3;
    const pillar = new T.Mesh(rough(new T.CylinderGeometry(1.4 + (i % 3), 2 + (i % 3), h, 7), 0.5, 300 + i), mat(0x3f5a3a));
    pillar.position.set(Math.cos(a) * r, h / 2 - 3, Math.sin(a) * r - 6);
    const cap = new T.Mesh(rough(new T.CylinderGeometry(1.8 + (i % 3), 1.5 + (i % 3), 0.8, 7), 0.4, 400 + i), mat(0x5e9c41));
    cap.position.set(pillar.position.x, h - 3 + 0.3, pillar.position.z);
    far.add(pillar, cap);
  }

  // Shafts of light slanting down through the canopy.
  const rays = [];
  for (let i = 0; i < 5; i++) {
    const ray = new T.Mesh(new T.CylinderGeometry(0.6, 1.8, 26, 12, 1, true), new T.MeshBasicMaterial({ color: 0xfff3b0, transparent: true, opacity: 0.06, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }));
    ray.position.set(-9 + i * 4.5, 8, -4 + (i % 2) * 3); ray.rotation.z = 0.35; scene.add(ray); rays.push(ray);
  }

  // Drifting motes of light.
  const N = 260, pos = new Float32Array(N * 3), seeds = [];
  for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 22; pos[i * 3 + 1] = Math.random() * 5 - 1.5; pos[i * 3 + 2] = (Math.random() - 0.5) * 12; seeds.push(Math.random() * 6); }
  const pgeo = new T.BufferGeometry(); pgeo.setAttribute("position", new T.BufferAttribute(pos, 3));
  const motes = new T.Points(pgeo, new T.PointsMaterial({ size: 0.12, map: glowTex, color: 0xd9ff9c, transparent: true, depthWrite: false, blending: T.AdditiveBlending }));
  scene.add(motes);

  // A few pawns standing on squares; they are children of their island, so they float with it.
  [[0, 0x7c3aed], [0, 0x2563eb], [9, 0xd97706], [21, 0x16a34a]].forEach(([i, c], n) => {
    const p = new T.Group();
    const body = new T.Mesh(new T.CylinderGeometry(0.1, 0.16, 0.34, 14), mat(c, { flatShading: false, roughness: 0.4 })); body.position.y = 0.17;
    const head = new T.Mesh(new T.SphereGeometry(0.11, 16, 12), mat(c, { flatShading: false, roughness: 0.4 })); head.position.y = 0.42;
    body.castShadow = head.castShadow = true; p.add(body, head);
    p.position.set((n % 2 ? 0.18 : -0.18) * (i === 0 ? 1 : 0), 0.15, 0.2);
    tiles[i].g.add(p);
  });

  // ---------- Camera: drag to turn, a slow sway otherwise ----------
  let yaw = 0, pitch = 0.62, dist = 17, drag = null, auto = 0;
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h); camera.aspect = w / h;
    dist = w < h ? 27 : 17; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();
  renderer.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
  renderer.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return;
    yaw -= (e.clientX - drag.x) * 0.005; pitch = Math.max(0.3, Math.min(1.1, pitch + (e.clientY - drag.y) * 0.004));
    drag = { x: e.clientX, y: e.clientY }; auto = 0;
  });
  renderer.domElement.addEventListener("pointerup", () => (drag = null));

  const toggles = { bob: "bob", glow: "glow", para: "para" };
  Object.keys(toggles).forEach((k) => {
    const b = document.getElementById(k);
    b.setAttribute("aria-pressed", String(opts[k]));
    b.onclick = () => { opts[k] = !opts[k]; b.setAttribute("aria-pressed", String(opts[k])); };
  });

  const clock = new T.Clock();
  (function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    auto += dt;
    const sway = reduce ? 0 : Math.sin(t * 0.15) * 0.25 * Math.min(1, auto / 3);
    const y = yaw + sway;
    camera.position.set(Math.sin(y) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(y) * Math.cos(pitch) * dist);
    camera.lookAt(0, 0, 0);
    // Parallax: the far layer follows the camera part of the way, so it seems to drift slower.
    far.position.set(opts.para ? camera.position.x * 0.45 : 0, 0, opts.para ? (camera.position.z - dist) * 0.3 : 0);
    // Each island breathes up and down on its own clock.
    tiles.forEach((tl) => {
      const h = opts.bob ? Math.sin((t / tl.period) * Math.PI * 2 + tl.phase) * 0.06 : 0;
      tl.g.position.y = (tl.sh ? 0 : -0.35) + h;
      if (tl.sh) { const s = 1 - h * 1.5; tl.sh.scale.set(s, s, 1); tl.sh.material.opacity = 0.9 - h * 3; }
      if (tl.gl) { tl.gl.visible = opts.glow; tl.gl.position.y = -0.9 + h; tl.gl.material.opacity = 0.45 + Math.sin(t * 1.3 + tl.phase) * 0.12; }
    });
    floaters.forEach((f) => {
      if (f.flag) f.flag.rotation.y = Math.sin(t * 3 + f.t) * 0.35;
      if (f.spin) f.spin.rotation.y += dt * 1.2;
      if (f.pulse) f.pulse.material.opacity = 0.4 + Math.sin(t * 2.4) * 0.2;
    });
    motes.visible = opts.glow; rays.forEach((r) => (r.visible = opts.glow));
    if (opts.glow) {
      const p = pgeo.attributes.position;
      for (let i = 0; i < N; i++) {
        let yy = p.getY(i) + dt * 0.18; if (yy > 4) yy = -1.5;
        p.setY(i, yy); p.setX(i, p.getX(i) + Math.sin(t * 0.6 + seeds[i]) * dt * 0.08);
      }
      p.needsUpdate = true;
    }
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
